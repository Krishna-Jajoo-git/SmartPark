# ==============================================================================
# SmartPark Management System Configuration
# ==============================================================================

server.port=8080
server.servlet.context-path=/

# PostgreSQL Datasource Configuration with Environment Variable Fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartpark}
spring.datasource.username=${DB_USERNAME:aura_admin_Krishna}
spring.datasource.password=${DB_PASSWORD:aura_secure_password_Krishna}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Timezone Configuration (UTC Standard across system)
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
